    <script>
      (function() {
        // Prevent unhandled WebSocket connection errors in sandbox/preview
        try {
          var OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) isViteHmr = true;
            if (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; })) isViteHmr = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf(':3000') !== -1)) isViteHmr = true;

            if (isViteHmr) {
              var listeners = {};
              return {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                addEventListener: function(event, fn) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(f) { return f !== fn; });
                  }
                },
                send: function() {},
                close: function() {
                  this.readyState = 3;
                  if (listeners['close']) {
                    listeners['close'].forEach(function(f) {
                      try { f({ type: 'close', wasClean: true }); } catch (e) {}
                    });
                  }
                },
                dispatchEvent: function() { return true; }
              };
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        } catch (e) {}

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('websocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || '')) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('websocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
